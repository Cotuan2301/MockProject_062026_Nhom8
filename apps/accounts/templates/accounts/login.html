{% extends "base.html" %} {% block content %}
<!--Form login -->
<div class="bg-gray">
  <section
    class="bread-crumb"
    style="background-image: url(/static/images/ImageLogin.jpg)"
  >
    <div class="container">
      <div class="title-bread-crumb">ĐĂNG NHẬP TÀI KHOẢN</div>
      <ul class="breadcrumb">
        <li class="home">
          <a href="/"><span>Trang chủ</span></a>
          <span class="mr_lr"
            >&nbsp;<svg
              aria-hidden="true"
              focusable="false"
              data-prefix="fas"
              data-icon="chevron-right"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 320 512"
              class="svg-inline--fa fa-chevron-right fa-w-10"
            >
              <path
                fill="currentColor"
                d="M285.476 272.971L91.132 467.314c-9.373 9.373-24.569 9.373-33.941 0l-22.667-22.667c-9.357-9.357-9.375-24.522-.04-33.901L188.505 256 34.484 101.255c-9.335-9.379-9.317-24.544.04-33.901l22.667-22.667c9.373-9.373 24.569-9.373 33.941 0L285.475 239.03c9.373 9.372 9.373 24.568.001 33.941z"
                class=""
              ></path></svg
            >&nbsp;</span
          >
        </li>

        <li>
          <strong><span>Đăng nhập tài khoản</span></strong>
        </li>
      </ul>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="page_login">
        <div class="row">
          <div
            class="col-lg-4 col-md-6 col-sm-12 col-xl-4 offset-0 offset-xl-4 offset-lg-4 offset-md-3 offset-xl-3 col-12"
          >
            <div class="page-login pagecustome clearfix">
              <div class="wpx">
                <h1 class="title_heads a-center" style="display: none">
                  <span>Đăng nhập</span>
                </h1>
                <div id="login" class="section">
                  <form
                    method="post"
                    action="/account/login"
                    id="customer_login"
                    accept-charset="UTF-8"
                  >
                    <input
                      name="FormType"
                      type="hidden"
                      value="customer_login"
                    /><input name="utf8" type="hidden" value="true" />
                    <span class="form-signup" style="color: red"> </span>
                    <div class="form-signup clearfix">
                      <fieldset class="form-group">
                        <label
                          for="customer_email"
                          style="
                            font-weight: 500;
                            margin-bottom: 5px;
                            display: block;
                          "
                          >Email</label
                        >
                        <input
                          type="email"
                          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$"
                          class="form-control form-control-lg custom-input"
                          value=""
                          name="email"
                          id="customer_email"
                          placeholder="Email"
                          required=""
                        />
                      </fieldset>
                      <fieldset class="form-group">
                        <label
                          for="customer_password"
                          style="
                            font-weight: 500;
                            margin-bottom: 5px;
                            display: block;
                          "
                          >Mật khẩu</label
                        >
                        <input
                          type="password"
                          class="form-control form-control-lg custom-input"
                          value=""
                          name="password"
                          id="customer_password"
                          placeholder="Mật khẩu"
                          required=""
                        />
                      </fieldset>
                      <div class="pull-xs-left" style="margin-top: 15px">
                        <button
                          type="submit"
                          value="Đăng nhập"
                          class="btn btn-primary btn-style custom-btn"
                        >
                          ĐĂNG NHẬP
                        </button>
                      </div>
                      <div
                        class="btn_boz_khac"
                        style="margin-top: 15px; width: 100%"
                      >
                        <div
                          style="
                            display: flex;
                            justify-content: space-between;
                            font-size: 14px;
                            width: 100%;
                          "
                        >
                          <a
                            href="#"
                            class="quenmk text-muted"
                            style="
                              color: gray !important;
                              text-decoration: none;
                            "
                            >Quên mật khẩu?</a
                          >
                          <a
                            href="#"
                            class="btn-link-style btn-register text-muted"
                            title="Đăng ký tại đây"
                            style="
                              color: gray !important;
                              text-decoration: none;
                            "
                            >Đăng ký tại đây</a
                          >
                        </div>
                      </div>
                    </div>
                  </form>
                </div>

                <div class="h_recover" style="display: none">
                  <div id="recover-password" class="form-signup page-login">
                    <form
                      method="post"
                      action="/account/recover"
                      id="recover_customer_password"
                      accept-charset="UTF-8"
                    >
                      <input
                        name="FormType"
                        type="hidden"
                        value="recover_customer_password"
                      /><input name="utf8" type="hidden" value="true" />
                      <div class="form-signup" style="color: red"></div>
                      <div class="form-signup clearfix">
                        <fieldset class="form-group">
                          <input
                            type="email"
                            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$"
                            class="form-control form-control-lg"
                            value=""
                            name="Email"
                            id="recover-email"
                            placeholder="Email"
                            required=""
                          />
                        </fieldset>
                      </div>
                      <div class="action_bottom">
                        <button
                          type="submit"
                          value="Lấy lại mật khẩu"
                          class="btn btn-primary"
                          style="margin-top: 0px"
                        >
                          Lấy lại mật khẩu
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
                <div class="block social-login--facebooks">
                  <div class="line-break">
                    <span>hoặc đăng nhập qua</span>
                  </div>
                  <script>
                    function loginFacebook() {
                      var a = {
                          client_id: "1074143986372695",
                          redirect_uri:
                            "https://store.mysapo.net/account/facebook_account_callback",
                          state: JSON.stringify({
                            redirect_url: window.location.href,
                          }),
                          scope: "email",
                          response_type: "code",
                        },
                        b =
                          "https://www.facebook.com/v3.2/dialog/oauth" +
                          encodeURIParams(a, !0);
                      window.location.href = b;
                    }
                    function loginGoogle() {
                      var a = {
                          client_id:
                            "997675985899-pu3vhvc2rngfcuqgh5ddgt7mpibgrasr.apps.googleusercontent.com",
                          redirect_uri:
                            "https://store.mysapo.net/account/google_account_callback",
                          scope:
                            "email profile https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile",
                          access_type: "online",
                          state: JSON.stringify({
                            redirect_url: window.location.href,
                          }),
                          response_type: "code",
                        },
                        b =
                          "https://accounts.google.com/o/oauth2/v2/auth" +
                          encodeURIParams(a, !0);
                      window.location.href = b;
                    }
                    function encodeURIParams(a, b) {
                      var c = [];
                      for (var d in a)
                        if (a.hasOwnProperty(d)) {
                          var e = a[d];
                          null != e &&
                            c.push(
                              encodeURIComponent(d) +
                                "=" +
                                encodeURIComponent(e),
                            );
                        }
                      return 0 == c.length ? "" : (b ? "?" : "") + c.join("&");
                    }
                  </script>
                  <a
                    href="javascript:void(0)"
                    class="social-login--facebook"
                    onclick="loginFacebook()"
                    ><img
                      width="129px"
                      height="37px"
                      alt="facebook-login-button"
                      src="//bizweb.dktcdn.net/assets/admin/images/login/fb-btn.svg"
                  /></a>
                  <a
                    href="javascript:void(0)"
                    class="social-login--google"
                    onclick="loginGoogle()"
                    ><img
                      width="129px"
                      height="37px"
                      alt="google-login-button"
                      src="//bizweb.dktcdn.net/assets/admin/images/login/gp-btn.svg"
                  /></a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
