<header class="navbar">
  <div class="navbar-left">
    <!-- Brand moved to sidebar -->
  </div>
  <div class="navbar-right">
    <div class="navbar-icons" style="align-items: center;">
      <span style="display: flex;">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      </span> <!-- Bell icon -->
      <span style="display: flex;">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </span> <!-- Help icon -->
    </div>


    <!-- Right: notification, help, user -->
    <div class="admin-header__right">
        <!-- Notification bell -->
        <button class="header-icon-btn" id="btnNotifications" aria-label="Notifications" title="Notifications">
            <i class="fas fa-bell"></i>
            <span class="notif-badge">3</span>
        </button>

        <!-- Help -->
        <button class="header-icon-btn" id="btnHelp" aria-label="Help" title="Help & Documentation">
            <i class="fas fa-circle-question"></i>
        </button>

        <!-- User menu -->
        <div class="user-menu" id="userMenuToggle" role="button" aria-haspopup="true" aria-expanded="false">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">

                <span class="user-name">Denise Carter</span>
                <span class="user-role">DON</span>

                <span class="user-name">Anna Lee</span>
                <span class="user-role">Nurse</span>

            </div>
            <i class="fas fa-chevron-down user-chevron"></i>

            <!-- Dropdown menu -->
            <div class="user-dropdown" id="userDropdown" role="menu">
                <a href="#" role="menuitem">
                    <i class="fas fa-user-circle"></i> My Profile
                </a>
                <a href="#" role="menuitem">
                    <i class="fas fa-gear"></i> Account Settings
                </a>
                <div class="dropdown-divider"></div>
                <a href="{% url 'accounts:login' %}" class="logout-link" role="menuitem">
                    <i class="fas fa-right-from-bracket"></i> Sign Out
                </a>
            </div>
        </div>

    <div class="navbar-user">
      <div class="user-avatar">
        <span style="font-weight: 600; color: #555; font-size: 13px;">AL</span>
      </div>
      <div class="user-info">
        <span class="user-name">Anna Lee</span>
        <span class="user-role">Nurse</span>
      </div>
      <span style="display: flex; color: #888;">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </span> <!-- Dropdown arrow -->

    </div>
  </div>
</header>
